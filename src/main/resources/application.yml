spring:
  application:
    name: pitflow-payment
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:pitflow_payment}
    username: ${DB_USERNAME:pitflow_payment}
    password: ${DB_PASSWORD:pitflow_payment}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
server:
  servlet:
    context-path: /payment
  forward-headers-strategy: framework
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
aws:
  region: ${AWS_REGION:us-east-1}
  sqs:
    payment-command-queue: ${PAYMENT_COMMAND_QUEUE_NAME:payment-command-queue}
    orchestrator-queue: ${ORCHESTRATOR_QUEUE_NAME:service-order-orchestrator-queue}
payment:
  consumer:
    enabled: ${PAYMENT_CONSUMER_ENABLED:false}
    delay-ms: ${PAYMENT_CONSUMER_DELAY_MS:1000}
    wait-time-seconds: ${PAYMENT_CONSUMER_WAIT_SECONDS:20}
  outbox:
    enabled: ${PAYMENT_OUTBOX_ENABLED:false}
    delay-ms: ${PAYMENT_OUTBOX_DELAY_MS:5000}
    batch-size: ${PAYMENT_OUTBOX_BATCH_SIZE:10}
    lease-seconds: ${PAYMENT_OUTBOX_LEASE_SECONDS:60}
    max-backoff-seconds: ${PAYMENT_OUTBOX_MAX_BACKOFF_SECONDS:300}
  mercado-pago:
    enabled: ${MERCADO_PAGO_ENABLED:false}
    base-url: ${MERCADO_PAGO_BASE_URL:https://api.mercadopago.com}
    access-token: ${MERCADO_PAGO_ACCESS_TOKEN:}
    test-mode: ${MERCADO_PAGO_TEST_MODE:true}
    webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET:}
  webhook:
    enabled: ${PAYMENT_WEBHOOK_ENABLED:false}
api:
  security:
    token:
      secret: ${JWT_SECRET:}
