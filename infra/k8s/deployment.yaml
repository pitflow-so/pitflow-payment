apiVersion: apps/v1
kind: Deployment
metadata:
  name: pitflow-payment
  namespace: pitflow
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pitflow-payment
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pitflow-payment
        app.kubernetes.io/part-of: pitflow
        tags.datadoghq.com/env: "producao"
        tags.datadoghq.com/service: "pitflow-payment"
        tags.datadoghq.com/version: "${IMAGE_VERSION}"
      annotations:
        admission.datadoghq.com/java-lib.version: "latest"
    spec:
      containers:
        - name: pitflow-payment
          image: "${CONTAINER_IMAGE}"
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75 -XX:InitialRAMPercentage=25"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: pitflow-payment-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: pitflow-payment-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: pitflow-payment-config
                  key: DB_NAME
            - name: DB_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: pitflow-payment-config
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pitflow-payment-secrets
                  key: DB_PASSWORD
            - name: MERCADO_PAGO_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pitflow-payment-secrets
                  key: MERCADO_PAGO_ACCESS_TOKEN
            - name: MERCADO_PAGO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: pitflow-payment-secrets
                  key: MERCADO_PAGO_WEBHOOK_SECRET
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pitflow-payment-secrets
                  key: JWT_SECRET
            - name: AWS_REGION
              value: "us-east-1"
            - name: PAYMENT_COMMAND_QUEUE_NAME
              value: "payment-command-queue"
            - name: ORCHESTRATOR_QUEUE_NAME
              value: "service-order-orchestrator-queue"
            - name: PAYMENT_CONSUMER_ENABLED
              value: "true"
            - name: PAYMENT_OUTBOX_ENABLED
              value: "true"
            - name: PAYMENT_WEBHOOK_ENABLED
              value: "true"
            - name: MERCADO_PAGO_TEST_MODE
              value: "true"
            - name: MERCADO_PAGO_ENABLED
              value: "true"
          startupProbe:
            httpGet:
              path: /payment/actuator/health
              port: 8080
            failureThreshold: 18
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /payment/actuator/health
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /payment/actuator/health
              port: 8080
            periodSeconds: 15
